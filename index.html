<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prakaipad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pad-amber: 245, 158, 11;
            --pad-pink: 236, 72, 153;
            --pad-red: 239, 68, 68;
            --pad-cyan: 6, 182, 212;
            --pad-teal: 20, 184, 166;
            --pad-blue: 59, 130, 246;
            --pad-indigo: 99, 102, 241;
            --pad-violet: 139, 92, 246;
            --pad-yellow: 234, 179, 8;
            --pad-purple: 168, 85, 247;
            --pad-green: 34, 197, 94;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f111a;
            color: #f3f4f6;
            touch-action: none;
            user-select: none;
            overflow: hidden;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .drum-pad {
            position: absolute;
            border-radius: 1.5rem;
            background: linear-gradient(145deg, #1e2235, #151826);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 5px 5px 15px #0a0b11, -5px -5px 15px #1c2031;
            transition: transform 0.05s ease, box-shadow 0.1s ease, border-color 0.1s ease, background 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .drum-pad::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.1s;
            border-radius: inherit;
        }

        .glow-amber { background: linear-gradient(145deg, #451a03, #291102); border-color: rgb(var(--pad-amber)); }
        .glow-pink { background: linear-gradient(145deg, #500724, #300414); border-color: rgb(var(--pad-pink)); }
        .glow-red { background: linear-gradient(145deg, #450a0a, #2b0404); border-color: rgb(var(--pad-red)); }
        .glow-cyan { background: linear-gradient(145deg, #083344, #041e2b); border-color: rgb(var(--pad-cyan)); }
        .glow-teal { background: linear-gradient(145deg, #042f2e, #021a19); border-color: rgb(var(--pad-teal)); }
        .glow-blue { background: linear-gradient(145deg, #1e3a8a, #112254); border-color: rgb(var(--pad-blue)); }
        .glow-indigo { background: linear-gradient(145deg, #312e81, #1e1b4b); border-color: rgb(var(--pad-indigo)); }
        .glow-violet { background: linear-gradient(145deg, #2e1065, #1b083d); border-color: rgb(var(--pad-violet)); }
        .glow-yellow { background: linear-gradient(145deg, #422006, #261203); border-color: rgb(var(--pad-yellow)); }
        .glow-purple { background: linear-gradient(145deg, #3b0764, #23043d); border-color: rgb(var(--pad-purple)); }
        .glow-green { background: linear-gradient(145deg, #064e3b, #032b20); border-color: rgb(var(--pad-green)); }

        .drum-pad.active { 
            transform: scale(0.92); 
            filter: brightness(1.3);
        }

        .edit-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(3px);
            border-radius: inherit;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            z-index: 20;
            padding: 4px;
        }

        .edit-mode-active .edit-overlay { display: flex; }
        .edit-mode-active .edit-drag-icon { display: block !important; }

        .edit-mode-active .drum-pad {
            border: 2px dashed #4b5563;
            cursor: default; 
        }

        .resize-width {
            position: absolute;
            right: -4px; top: 50%;
            transform: translateY(-50%);
            width: 10px; height: 40%;
            cursor: ew-resize;
            display: none;
            align-items: center; justify-content: center;
            color: #9ca3af; z-index: 30; touch-action: none;
        }
        .resize-width:hover { color: #ffffff; }

        .resize-height {
            position: absolute;
            bottom: -4px; left: 50%;
            transform: translateX(-50%);
            width: 40%; height: 10px;
            cursor: ns-resize;
            display: none;
            align-items: center; justify-content: center;
            color: #9ca3af; z-index: 30; touch-action: none;
        }
        .resize-height:hover { color: #ffffff; }

        .edit-mode-active .resize-width,
        .edit-mode-active .resize-height { display: flex !important; }

        #message-box, #key-prompt, #preset-modal {
            transition: opacity 0.3s, transform 0.3s;
        }

        .keycap {
            background: #374151;
            border-bottom: 3px solid #1f2937;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #d1d5db;
        }
        .glow-amber .keycap  { background: #78350f; color: #fef3c7; border-bottom-color: #451a03; }
        .glow-pink .keycap   { background: #831843; color: #fce7f3; border-bottom-color: #500724; }
        .glow-red .keycap    { background: #7f1d1d; color: #fee2e2; border-bottom-color: #450a0a; }
        .glow-cyan .keycap   { background: #164e63; color: #cffafe; border-bottom-color: #083344; }
        .glow-teal .keycap   { background: #134e4a; color: #ccfbf1; border-bottom-color: #042f2e; }
        .glow-blue .keycap   { background: #1e3a8a; color: #dbeafe; border-bottom-color: #172554; }
        .glow-indigo .keycap { background: #312e81; color: #e0e7ff; border-bottom-color: #1e1b4b; }
        .glow-violet .keycap { background: #4c1d95; color: #ede9fe; border-bottom-color: #2e1065; }
        .glow-yellow .keycap { background: #713f12; color: #fef9c3; border-bottom-color: #422006; }
        .glow-purple .keycap { background: #581c87; color: #f3e8ff; border-bottom-color: #3b0764; }
        .glow-green .keycap  { background: #14532d; color: #dcfce7; border-bottom-color: #052e16; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col bg-[#0f111a]">

    <header class="w-full bg-[#151826] border-b border-gray-800 p-2 sm:p-3 flex justify-between items-center shadow-md z-30 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-br from-cyan-400 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-gem text-white text-sm sm:text-base animate-pulse"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-bold text-base sm:text-xl text-white tracking-wide">Prakaipad</h1>
                <p class="text-[9px] sm:text-[10px] text-gray-400">Version 2026.11.04.21.15 <span class="text-indigo-400 font-semibold">by Prakaipet Pankaew</span></p>
            </div>
        </div>
        
        <div class="flex items-center gap-1.5 sm:gap-3">
            <button id="stop-all-btn" class="flex items-center gap-1.5 bg-red-600 hover:bg-red-500 border border-red-500 text-xs px-2.5 sm:px-3 py-1.5 rounded-lg transition text-white shadow-lg font-bold active:scale-95" title="Stop All Sounds Immediately">
                <i class="fa-solid fa-volume-xmark text-sm"></i>
                <span class="hidden sm:inline">STOP ALL</span>
            </button>

            <button id="save-preset-btn" class="flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-600 border border-emerald-600 text-xs px-2.5 sm:px-3 py-1.5 rounded-lg transition text-white shadow-lg" title="Save Preset">
                <i class="fa-solid fa-floppy-disk"></i>
                <span class="hidden sm:inline">Save Preset</span>
            </button>
            <button id="load-preset-btn" class="flex items-center gap-1.5 bg-teal-700 hover:bg-teal-600 border border-teal-600 text-xs px-2.5 sm:px-3 py-1.5 rounded-lg transition text-white shadow-lg" title="Load Preset">
                <i class="fa-solid fa-folder-open"></i>
                <span class="hidden sm:inline">Load Preset</span>
            </button>
            
            <button id="add-pad-btn" class="hidden items-center gap-2 bg-indigo-600 hover:bg-indigo-500 border border-indigo-500 text-xs px-2.5 sm:px-3 py-1.5 rounded-lg transition text-white shadow-lg">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">Add Pad</span>
            </button>
            <button id="reset-default-btn" class="hidden items-center gap-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 text-xs px-2.5 sm:px-3 py-1.5 rounded-lg transition text-gray-200 shadow-lg">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
            <button id="edit-toggle" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs px-3 py-1.5 rounded-lg transition text-gray-200 shadow-lg">
                <i class="fa-solid fa-arrows-up-down-left-right"></i>
                <span class="hidden sm:inline">Edit Layout</span>
            </button>
        </div>
    </header>

    <main id="workspace" class="flex-1 w-full relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-900 to-[#0f111a]">
        <!-- Pads injected dynamically -->
    </main>

    <input type="file" id="audio-upload" accept="audio/wav, audio/mp3, audio/mpeg, audio/ogg" class="hidden">

    <div id="message-box" class="fixed top-20 left-1/2 transform -translate-x-1/2 opacity-0 -translate-y-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl border border-gray-700 z-50 flex items-center gap-3 pointer-events-none">
        <i class="fa-solid fa-bell text-indigo-400"></i>
        <span id="message-text" class="text-sm font-medium">Message</span>
    </div>

    <div id="preset-modal" class="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-[100] opacity-0 pointer-events-none" style="display: none;">
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl text-center w-80 max-w-full">
            <h2 class="text-lg font-bold text-white mb-3 font-orbitron flex items-center justify-center gap-2">
                <i class="fa-solid fa-layer-group text-teal-400"></i> Saved Presets
            </h2>
            <div id="preset-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto my-3 pr-1"></div>
            <button id="close-preset-modal" class="w-full mt-2 bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs py-2 rounded-lg transition">Close</button>
        </div>
    </div>

    <div id="key-prompt" class="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-[100] opacity-0 pointer-events-none" style="display: none;">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-2xl text-center max-w-sm">
            <div class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse pointer-events-none">
                <i class="fa-regular fa-keyboard text-2xl text-white"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 font-orbitron">Assign New Key</h2>
            <p class="text-gray-400 text-sm mb-4">Press any key or foot pedal to assign it to <span id="prompt-pad-name" class="text-indigo-400 font-bold"></span>.</p>
            <p class="text-xs text-gray-500">(Press ESC to cancel)</p>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isEditMode = false;
        let padAwaitingKey = null;
        let customPadCount = 0;
        const customBuffers = {};
        const activeSources = {};
        const workspace = document.getElementById('workspace');

        const DB_NAME = 'PrakaipadDB_v4';
        const STORE_NAME = 'audioBuffers';
        let db = null;

        function initIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 4);
                request.onerror = () => resolve(null);
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

        function saveAudioToDB(key, blob) {
            if (!db) return;
            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.put(blob, key);
            } catch (err) {
                console.error("Error saving audio to IndexedDB", err);
            }
        }

        function loadAllAudioFromDB() {
            return new Promise((resolve) => {
                if (!db) { resolve({}); return; }
                try {
                    const transaction = db.transaction([STORE_NAME], 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.openCursor();
                    const result = {};

                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            result[cursor.key] = cursor.value;
                            cursor.continue();
                        } else {
                            resolve(result);
                        }
                    };
                    request.onerror = () => resolve({});
                } catch (err) {
                    resolve({});
                }
            });
        }

        function deleteAudioFromDB(key) {
            if (!db) return;
            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.delete(key);
            } catch (err) {
                console.error("Error deleting audio from IndexedDB", err);
            }
        }

        // ตั้งค่า allowsOverlap: false เป็นค่าเริ่มต้น (ปิด Polyphony) และ zIndex: 5
        const defaultPadsConfig = [
            { id: 'pad-crash', name: 'CRASH 1', key: 'T', colorClass: 'glow-yellow', defaultSynth: 'playCrash', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-ride', name: 'RIDE', key: 'Y', colorClass: 'glow-purple', defaultSynth: 'playRide', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-tom1', name: 'TOM 1', key: 'E', colorClass: 'glow-blue', defaultSynth: 'playTom1', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-tom2', name: 'TOM 2', key: 'R', colorClass: 'glow-indigo', defaultSynth: 'playTom2', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-tom3', name: 'TOM 3', key: 'F', colorClass: 'glow-violet', defaultSynth: 'playTom3', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-hh-close', name: 'HI-HAT (C)', key: 'Q', colorClass: 'glow-cyan', defaultSynth: 'playHiHatClose', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-hh-open', name: 'HI-HAT (O)', key: 'W', colorClass: 'glow-teal', defaultSynth: 'playHiHatOpen', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-snare-rim', name: 'SNARE RIM', key: 'A', colorClass: 'glow-red', defaultSynth: 'playSnareRim', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-snare-center', name: 'SNARE CTR', key: 'S', colorClass: 'glow-pink', defaultSynth: 'playSnareCenter', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
            { id: 'pad-kick', name: 'KICK (BASS)', key: 'SPACE', colorClass: 'glow-amber', defaultSynth: 'playKick', volume: 1.0, width: 140, height: 140, x: 0, y: 0, allowsOverlap: false, zIndex: 5 },
        ];

        let drumPadsConfig = [];

        function saveConfigToLocalStorage() {
            localStorage.setItem('prakaipad_config_v4', JSON.stringify(drumPadsConfig));
        }

        function loadConfigFromLocalStorage() {
            const saved = localStorage.getItem('prakaipad_config_v4');
            if (saved) {
                try {
                    drumPadsConfig = JSON.parse(saved);
                    drumPadsConfig.forEach(p => {
                        if (p.volume === undefined) p.volume = 1.0;
                        if (p.width === undefined) p.width = p.size || 110;
                        if (p.height === undefined) p.height = p.size || 110;
                        if (p.allowsOverlap === undefined) p.allowsOverlap = false; // ตั้งค่าเริ่มต้นเป็นปิด
                        if (p.zIndex === undefined) p.zIndex = 5;
                        if (p.id.startsWith('pad-custom-')) {
                            const num = parseInt(p.id.replace('pad-custom-', ''));
                            if (!isNaN(num) && num > customPadCount) customPadCount = num;
                        }
                    });
                    return true;
                } catch (e) {
                    console.error("Failed to parse saved config", e);
                }
            }
            return false;
        }

        function initializePositionsAndConfig() {
            const loaded = loadConfigFromLocalStorage();
            const w = workspace.clientWidth || window.innerWidth;
            const h = workspace.clientHeight || (window.innerHeight - 80);

            if (!loaded || drumPadsConfig.length === 0) {
                drumPadsConfig = JSON.parse(JSON.stringify(defaultPadsConfig));
                const layoutMap = {
                    'pad-crash': {x: 0.2, y: 0.15},
                    'pad-ride': {x: 0.8, y: 0.15},
                    'pad-tom1': {x: 0.35, y: 0.2},
                    'pad-tom2': {x: 0.65, y: 0.2},
                    'pad-hh-open': {x: 0.1, y: 0.4},
                    'pad-hh-close': {x: 0.2, y: 0.55},
                    'pad-tom3': {x: 0.75, y: 0.45},
                    'pad-snare-rim': {x: 0.35, y: 0.5},
                    'pad-snare-center': {x: 0.45, y: 0.65},
                    'pad-kick': {x: 0.5, y: 0.8}
                };

                drumPadsConfig.forEach(pad => {
                    const pos = layoutMap[pad.id] || {x: 0.5, y: 0.5};
                    const wPad = pad.width || 140;
                    const hPad = pad.height || 140;
                    let pxX = (pos.x * w) - (wPad / 2);
                    let pxY = (pos.y * h) - (hPad / 2);
                    pad.x = Math.max(0, Math.min(pxX, w - wPad));
                    pad.y = Math.max(0, Math.min(pxY, h - hPad));
                });
                saveConfigToLocalStorage();
            }
        }

        function renderPads() {
            workspace.innerHTML = '';
            drumPadsConfig.forEach(pad => {
                createPadElement(pad);
            });
        }

        function createPadElement(pad) {
            const padEl = document.createElement('div');
            const currentColor = pad.colorClass || 'glow-indigo';
            padEl.className = `drum-pad ${currentColor}`;
            padEl.id = pad.id;
            padEl.style.left = `${pad.x}px`;
            padEl.style.top = `${pad.y}px`;
            padEl.style.zIndex = pad.zIndex !== undefined ? pad.zIndex : 5;
            
            const currentWidth = pad.width !== undefined ? pad.width : 140;
            const currentHeight = pad.height !== undefined ? pad.height : 140;
            padEl.style.width = `${currentWidth}px`;
            padEl.style.height = `${currentHeight}px`;

            const displayKey = pad.key === ' ' ? 'SPACE' : pad.key;
            const displayName = pad.name;
            const currentVol = pad.volume !== undefined ? pad.volume : 1.0;
            const isOverlapActive = pad.allowsOverlap !== undefined ? pad.allowsOverlap : false;

            padEl.innerHTML = `
                <div class="drag-handle absolute -top-[15px] left-0 text-gray-400 hover:text-white cursor-move hidden edit-drag-icon p-1 z-30">
                    <i class="fa-solid fa-arrows-up-down-left-right text-xs"></i>
                </div>

                <div class="resize-width" title="Drag to resize width">
                    <i class="fa-solid fa-grip-vertical text-[10px]"></i>
                </div>
                <div class="resize-height" title="Drag to resize height">
                    <i class="fa-solid fa-grip-lines text-[10px]"></i>
                </div>

                <span class="font-orbitron font-bold text-xs text-gray-200 tracking-wide text-center pointer-events-none mt-2">${displayName}</span>
                <div class="mt-1 keycap pointer-events-none key-display">${displayKey || '-'}</div>
                
                <div class="edit-overlay">
                    <div class="flex items-center justify-between w-[92%] bg-gray-900/90 px-1.5 py-0.5 rounded text-[9px] text-gray-300">
                        <span class="text-[8px] font-semibold">Vol</span>
                        <input type="range" min="0" max="1" step="0.05" value="${currentVol}" class="vol-slider w-14 accent-indigo-500 cursor-pointer">
                    </div>

                    <!-- ปุ่มเปิด/ปิด Polyphony (ค่าเริ่มต้นเป็น OFF) -->
                    <div class="flex items-center justify-between w-[92%] bg-gray-900/90 px-1.5 py-0.5 rounded text-[9px] text-gray-300">
                        <span class="text-[8px] font-semibold">Polyphony</span>
                        <button class="overlap-toggle-btn px-1.5 py-0.5 rounded text-[8px] font-bold transition ${isOverlapActive ? 'bg-emerald-600 text-white' : 'bg-gray-700 text-gray-400'}" title="เปิด/ปิดการกดซ้ำแล้วเล่นเสียงซ้อนกัน">
                            ${isOverlapActive ? 'ON' : 'OFF'}
                        </button>
                    </div>

                    <!-- [ใหม่] ปุ่มปรับ Layer สูงขึ้น +1 -->
                    <div class="flex items-center justify-between">
                        <span class="text-[8px] font-semibold"> <span class="layer-val">${padEl.style.zIndex}</span>)</span>
                        <button class="layer-up-btn px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-[8px] font-bold transition">
                            Up Layer
                        </button>
                    </div>

                    <div class="flex items-center justify-between w-[92%] bg-gray-900/90 px-1.5 py-0.5 rounded text-[9px] text-gray-300">
                        <span class="text-[8px] font-semibold">Color</span>
                        <select class="color-select bg-gray-800 text-white rounded px-0.5 py-0.5 text-[8px] cursor-pointer outline-none">
                            <option value="glow-amber" ${currentColor === 'glow-amber' ? 'selected' : ''}>Amber</option>
                            <option value="glow-pink" ${currentColor === 'glow-pink' ? 'selected' : ''}>Pink</option>
                            <option value="glow-red" ${currentColor === 'glow-red' ? 'selected' : ''}>Red</option>
                            <option value="glow-cyan" ${currentColor === 'glow-cyan' ? 'selected' : ''}>Cyan</option>
                            <option value="glow-teal" ${currentColor === 'glow-teal' ? 'selected' : ''}>Teal</option>

        function setupDraggable(el, padConfig) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            const dragHandle = el.querySelector('.drag-handle');
            if (!dragHandle) return;

            const onPointerMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                const padRect = el.getBoundingClientRect();
                const wsRect = workspace.getBoundingClientRect();
                
                if (newLeft < 0) newLeft = 0;
                if (newTop < 0) newTop = 0;
                if (newLeft + padRect.width > wsRect.width) newLeft = wsRect.width - padRect.width;
                if (newTop + padRect.height > wsRect.height) newTop = wsRect.height - padRect.height;

                el.style.left = `${newLeft}px`;
                el.style.top = `${newTop}px`;
                padConfig.x = newLeft;
                padConfig.y = newTop;
            };

            const onPointerUp = (e) => {
                if (!isDragging) return;
                isDragging = false;
                try { dragHandle.releasePointerCapture(e.pointerId); } catch(err) {}
                el.style.zIndex = padConfig.zIndex || 5;
                saveConfigToLocalStorage();
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            };

            dragHandle.addEventListener('pointerdown', (e) => {
                if (!isEditMode) return;
                e.stopPropagation();

                isDragging = true;
                try { dragHandle.setPointerCapture(e.pointerId); } catch(err) {}
                
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(el.style.left) || 0;
                initialTop = parseFloat(el.style.top) || 0;
                el.style.zIndex = 100;

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        function setupResizableIndependent(el, padConfig) {
            const resizerWidth = el.querySelector('.resize-width');
            const resizerHeight = el.querySelector('.resize-height');

            if (resizerWidth) {
                let isResizingW = false;
                let startX, startW;

                const onMoveW = (e) => {
                    if (!isResizingW) return;
                    const dx = e.clientX - startX;
                    const maxW = workspace.clientWidth - el.offsetLeft;
                    let newW = Math.max(50, startW + dx);
                    newW = Math.min(newW, maxW);

                    el.style.width = `${newW}px`;
                    padConfig.width = newW;
                };

                const onUpW = (e) => {
                    if (!isResizingW) return;
                    isResizingW = false;
                    try { resizerWidth.releasePointerCapture(e.pointerId); } catch(err) {}
                    saveConfigToLocalStorage();
                    window.removeEventListener('pointermove', onMoveW);
                    window.removeEventListener('pointerup', onUpW);
                };

                resizerWidth.addEventListener('pointerdown', (e) => {
                    if (!isEditMode) return;
                    e.stopPropagation();
                    isResizingW = true;
                    try { resizerWidth.setPointerCapture(e.pointerId); } catch(err) {}
                    startX = e.clientX;
                    startW = el.offsetWidth;
                    window.addEventListener('pointermove', onMoveW);
                    window.addEventListener('pointerup', onUpW);
                });
            }

            if (resizerHeight) {
                let isResizingH = false;
                let startY, startH;

                const onMoveH = (e) => {
                    if (!isResizingH) return;
                    const dy = e.clientY - startY;
                    const maxH = workspace.clientHeight - el.offsetTop;
                    let newH = Math.max(50, startH + dy);
                    newH = Math.min(newH, maxH);

                    el.style.height = `${newH}px`;
                    padConfig.height = newH;
                };

                const onUpH = (e) => {
                    if (!isResizingH) return;
                    isResizingH = false;
                    try { resizerHeight.releasePointerCapture(e.pointerId); } catch(err) {}
                    saveConfigToLocalStorage();
                    window.removeEventListener('pointermove', onMoveH);
                    window.removeEventListener('pointerup', onUpH);
                };

                resizerHeight.addEventListener('pointerdown', (e) => {
                    if (!isEditMode) return;
                    e.stopPropagation();
                    isResizingH = true;
                    try { resizerHeight.setPointerCapture(e.pointerId); } catch(err) {}
                    startY = e.clientY;
                    startH = el.offsetHeight;
                    window.addEventListener('pointermove', onMoveH);
                    window.addEventListener('pointerup', onUpH);
                });
            }
        }

        window.addEventListener('keydown', (e) => {

        function closeKeyPrompt() {

        document.getElementById('audio-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !currentUploadPadId) return;

            initAudio();

            const reader = new FileReader();
            reader.onload = function(ev) {
                const arrayBuffer = ev.target.result;
                const blob = new Blob([arrayBuffer], { type: file.type });
                
                audioCtx.decodeAudioData(arrayBuffer.slice(0), function(buffer) {
                    customBuffers[currentUploadPadId] = buffer;
                    saveAudioToDB(currentUploadPadId, blob);
                    renderPads();
                    showMessage("Audio loaded and saved permanently!");
                }, function(err) {
                    showMessage("Error decoding audio file.", true);
                    console.error(err);
                });
            };
            reader.readAsArrayBuffer(file);
            this.value = '';
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function stopAllSounds() {
            for (const id in activeSources) {
                stopActiveSource(id);
            }
            if (audioCtx) {
                try {
                    audioCtx.suspend().then(() => {
                        audioCtx.resume();
                    });
                } catch (e) {}
            }
            showMessage("หยุดเสียงทั้งหมดแล้ว!");
        }

        document.getElementById('stop-all-btn').addEventListener('click', stopAllSounds);

        function stopActiveSource(id) {
            if (activeSources[id]) {
                const sources = Array.isArray(activeSources[id]) ? activeSources[id] : [activeSources[id]];
                sources.forEach(src => {
                    try {
                        if (Array.isArray(src)) {
                            src.forEach(s => { try { s.stop(); s.disconnect(); } catch (e) {} });
                        } else if (src && typeof src.stop === 'function') {
                            src.stop();
                            src.disconnect();
                        }
                    } catch (e) {}
                });
                activeSources[id] = [];
            }
        }

        function registerActiveSource(id, sourceNode, allowsOverlap) {
            if (!activeSources[id]) {
                activeSources[id] = [];
            }
            if (!allowsOverlap) {
                stopActiveSource(id);
                activeSources[id] = [sourceNode];
            } else {
                activeSources[id].push(sourceNode);
            }
        }

        function triggerPad(id) {
            initAudio();
            
            const padConf = drumPadsConfig.find(p => p.id === id);
            const allowsOverlap = padConf && padConf.allowsOverlap !== undefined ? padConf.allowsOverlap : false;
            
            if (!allowsOverlap) {
                stopActiveSource(id);
            }

            const padEl = document.getElementById(id);
            if (padEl) {
                padEl.classList.remove('active');
                void padEl.offsetWidth;
                padEl.classList.add('active');
                setTimeout(() => padEl.classList.remove('active'), 100);
            }

            const padVol = padConf && padConf.volume !== undefined ? padConf.volume : 1.0;

            if (customBuffers[id]) {
                playCustomBuffer(id, customBuffers[id], padVol, allowsOverlap);
            } else {
                if (padConf && padConf.defaultSynth && window[padConf.defaultSynth]) {
                    window[padConf.defaultSynth](id, padVol, allowsOverlap);
                } else {
                    playTom1(id, padVol, allowsOverlap);
                }
            }
        }

        function playCustomBuffer(id, buffer, volume = 1.0, allowsOverlap = false) {
            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            source.buffer = buffer;
            gainNode.gain.value = volume;
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            source.start(0);

            registerActiveSource(id, source, allowsOverlap);
        }

        function playKick(id, volume = 1.0, allowsOverlap = false) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            
            osc.start(now);
            osc.stop(now + 0.5);
            registerActiveSource(id, osc, allowsOverlap);
        }

        function playSnareCenter(id, volume = 1.0, allowsOverlap = false) {
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;
            const noiseGain = audioCtx.createGain();
            
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            osc.frequency.setValueAtTime(250, now);
            oscGain.gain.setValueAtTime(0.7 * volume, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            
            noiseGain.gain.setValueAtTime(volume, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            osc.start(now);
            noise.start(now);
            osc.stop(now + 0.2);
            registerActiveSource(id, noise, allowsOverlap);
        }

        function playSnareRim(id, volume = 1.0, allowsOverlap = false) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            gain.gain.setValueAtTime(0.8 * volume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            
            osc.start(now);
            osc.stop(now + 0.1);
            registerActiveSource(id, osc, allowsOverlap);
        }

        function playHiHatClose(id, volume = 1.0, allowsOverlap = false) { createCymbalSound(id, 0.1, 5000, 0.5 * volume, false, allowsOverlap); }
        function playHiHatOpen(id, volume = 1.0, allowsOverlap = false) { createCymbalSound(id, 0.4, 4000, 0.4 * volume, false, allowsOverlap); }
        function playCrash(id, volume = 1.0, allowsOverlap = false) { createCymbalSound(id, 1.5, 2000, 0.8 * volume, false, allowsOverlap); }
        function playRide(id, volume = 1.0, allowsOverlap = false) { createCymbalSound(id, 1.2, 6000, 0.6 * volume, true, allowsOverlap); }

        function createCymbalSound(id, duration, freq, volume, isRide = false, allowsOverlap = false) {
            const ratios = isRide ? [1, 1.2, 1.6, 2.3, 3.1] : [1, 1.48, 1.93, 2.54, 2.61, 3.89];
            const gain = audioCtx.createGain();
            const bandpass = audioCtx.createBiquadFilter();
            
            bandpass.type = 'bandpass';
            bandpass.frequency.value = freq;
            bandpass.Q.value = 1;
            
            gain.connect(bandpass);
            bandpass.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

            const oscNodes = [];
            ratios.forEach((ratio) => {
                const osc = audioCtx.createOscillator();
                osc.type = 'square';
                osc.frequency.value = 400 * ratio;
                osc.connect(gain);
                osc.start(now);
                osc.stop(now + duration);
                oscNodes.push(osc);
            });
            registerActiveSource(id, oscNodes, allowsOverlap);
        }

        function playTom1(id, volume = 1.0, allowsOverlap = false) { playTom(id, 300, 0.4, volume, allowsOverlap); }
        function playTom2(id, volume = 1.0, allowsOverlap = false) { playTom(id, 200, 0.5, volume, allowsOverlap); }
        function playTom3(id, volume = 1.0, allowsOverlap = false) { playTom(id, 100, 0.6, volume, allowsOverlap); }

        function playTom(id, baseFreq, duration, volume = 1.0, allowsOverlap = false) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(baseFreq * 1.5, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.1);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc.start(now);
            osc.stop(now + duration);
            registerActiveSource(id, osc, allowsOverlap);
        }

        function showMessage(text, isError = false) {

            document.getElementById('message-text').innerText = text;

            setTimeout(() => {
                msgBox.classList.remove('opacity-100', 'translate-y-0');

        }

        const editToggle = document.getElementById('edit-toggle');
        const addPadBtn = document.getElementById('add-pad-btn');
        const resetDefaultBtn = document.getElementById('reset-default-btn');
        const ws = document.getElementById('workspace');

            } else {
                ws.classList.remove('edit-mode-active');
                editToggle.classList.replace('bg-indigo-600', 'bg-gray-800');
                editToggle.classList.replace('text-white', 'text-gray-200');
                editToggle.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> <span class="hidden sm:inline">Edit Layout</span>';
                addPadBtn.classList.add('hidden');
                addPadBtn.classList.remove('flex');
                resetDefaultBtn.classList.add('hidden');
                resetDefaultBtn.classList.remove('flex');
            }
        });

        resetDefaultBtn.addEventListener('click', () => {
            if (confirm("Reset layout, volume, and custom keys to default?")) {
                localStorage.removeItem('prakaipad_config_v4');
                if (db) {
                    try {
                        const tx = db.transaction([STORE_NAME], 'readwrite');
                        tx.objectStore(STORE_NAME).clear();
                    } catch (e) {}
                }
                location.reload();
            }
        });

        function getSavedPresets() {
            const saved = localStorage.getItem('prakaipad_presets_list');
            return saved ? JSON.parse(saved) : {};
        }

        document.getElementById('save-preset-btn').addEventListener('click', async () => {
            const presetName = prompt("ตั้งชื่อ Preset (เช่น แนวนอน / แนวตั้ง / กลองชุด 1):");
            if (!presetName || presetName.trim() === "") return;

            const cleanName = presetName.trim();
            const presets = getSavedPresets();
            
            presets[cleanName] = JSON.parse(JSON.stringify(drumPadsConfig));
            localStorage.setItem('prakaipad_presets_list', JSON.stringify(presets));

            if (db) {
                for (const padId in customBuffers) {
                    try {
                        const tx = db.transaction([STORE_NAME], 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const request = store.get(padId);
                        request.onsuccess = () => {
                            if (request.result) {
                                saveAudioToDB(`preset_${cleanName}_${padId}`, request.result);
                            }
                        };
                    } catch (e) {}
                }
            }

            showMessage(`บันทึก Preset "${cleanName}" เรียบร้อยแล้ว!`);
        });

        document.getElementById('load-preset-btn').addEventListener('click', () => {
            const presets = getSavedPresets();
            const listContainer = document.getElementById('preset-list');
            listContainer.innerHTML = '';

            const presetNames = Object.keys(presets);
            if (presetNames.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-400 text-xs py-4">ไม่มี Preset ที่บันทึกไว้</p>';
            } else {
                presetNames.forEach(name => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between bg-gray-700/60 hover:bg-gray-700 p-2 rounded-lg text-xs text-white transition';
                    item.innerHTML = `
                        <span class="font-medium cursor-pointer flex-1 text-left" onclick="applyPreset('${name}')">${name}</span>
                        <button onclick="deletePreset('${name}')" class="text-red-400 hover:text-red-300 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    listContainer.appendChild(item);
                });
            }

            const modal = document.getElementById('preset-modal');
            modal.style.display = 'flex';
            modal.classList.remove('pointer-events-none');
            setTimeout(() => modal.style.opacity = '1', 10);
        });

        document.getElementById('close-preset-modal').addEventListener('click', closePresetModal);

        function closePresetModal() {
            const modal = document.getElementById('preset-modal');
            modal.style.opacity = '0';
            modal.classList.add('pointer-events-none');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        window.applyPreset = async function(name) {
            const presets = getSavedPresets();
            if (!presets[name]) return;

            drumPadsConfig = presets[name];
            saveConfigToLocalStorage();

            if (db) {
                const allBlobs = await loadAllAudioFromDB();
                for (const key in allBlobs) {
                    if (key.startsWith(`preset_${name}_`)) {
                        const padId = key.replace(`preset_${name}_`, '');
                        const blob = allBlobs[key];
                        saveAudioToDB(padId, blob);
                        if (blob) {
                            const arrayBuffer = await blob.arrayBuffer();
                            audioCtx.decodeAudioData(arrayBuffer, (decoded) => {
                                customBuffers[padId] = decoded;
                            });
                        }
                    }
                }
            }

            renderPads();
            closePresetModal();
            showMessage(`โหลด Preset "${name}" เรียบร้อยแล้ว!`);
        };

        window.deletePreset = function(name) {
            if (!confirm(`ต้องการลบ Preset "${name}" หรือไม่?`)) return;
            const presets = getSavedPresets();
            delete presets[name];
            localStorage.setItem('prakaipad_presets_list', JSON.stringify(presets));
            
            if (db) {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.key.startsWith(`preset_${name}_`)) {
                            store.delete(cursor.key);
                        }
                        cursor.continue();
                    }
                };
            }
            
            document.getElementById('load-preset-btn').click();
            showMessage(`ลบ Preset "${name}" แล้ว`);
        };

        window.addEventListener('load', async () => {
            await initIndexedDB();
            initializePositionsAndConfig();

            const savedAudioBlobs = await loadAllAudioFromDB();
            if (savedAudioBlobs && Object.keys(savedAudioBlobs).length > 0) {
                initAudio();
                for (const padId in savedAudioBlobs) {
                    if (padId.startsWith('preset_')) continue;
                    try {
                        const blob = savedAudioBlobs[padId];
                        if (blob) {
                            const arrayBuffer = await blob.arrayBuffer();
                            audioCtx.decodeAudioData(arrayBuffer, (decoded) => {
                                customBuffers[padId] = decoded;
                                renderPads();
                            }, (err) => {
                                console.error("Failed decoding stored audio for pad", padId, err);
                            });
                        }
                    } catch (e) {
                        console.error("Error processing saved audio for pad", padId, e);
                    }
                }
            }

            renderPads();
        });
    </script>
</body>
</html>
